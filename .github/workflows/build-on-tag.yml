# Personal-fork build, TRIGGERED BY A TAG. Use this for versioned builds. Typical flow:
#   git fetch upstream --tags
#   git rebase v11.4.0 pro-unlock      # replay the unlock patch onto a new upstream release
#   git tag v11.4.0-unlock             # name your patched build (NOT the same as upstream's tag)
#   git push origin pro-unlock         # update the branch
#   git push origin v11.4.0-unlock     # push JUST this tag -> triggers this workflow
#
# Builds a portable Release app signed with a stable self-signed cert; the app version is taken from
# the tag name. The stable cert keeps the code-signing identity constant across builds, so macOS keeps
# the granted Accessibility / Screen Recording permissions and updating is just replacing the .app.
# Upstream's ci_cd.yml is left untouched.
name: Build AltTab on tag (self-signed)

on:
  push:
    tags: ["*-unlock"] # only tags ending in -unlock (keeps clear of upstream's vX.Y.Z tags)
  workflow_dispatch: {} # manual runs still work (version falls back to 11.3.0)

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.0.1
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer

      - name: Derive version from tag
        id: ver
        run: |
          RAW="${GITHUB_REF_NAME}"
          V="$(printf '%s' "$RAW" | sed -E 's/^v//; s/-unlock$//')"
          case "$V" in [0-9]*) ;; *) V="11.3.0";; esac   # dispatch on a branch -> fallback
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V from ref $RAW"

      # Import the repo's stable self-signed cert into a fresh CI keychain so every build is signed
      # with the same identity (constant designated requirement -> macOS keeps TCC permissions).
      # Password is committed on purpose: the cert is a throwaway self-signed key already in the repo
      # (see FORK.md §4 trade-off). An empty p12 password fails macOS `security import` MAC checks.
      - name: Import stable self-signed certificate
        run: scripts/codesign/import_certificate_into_new_keychain.sh "scripts/codesign/unlock-signing" "alttab-unlock"

      - name: Build Release (self-signed)
        run: |
          set -o pipefail
          xcodebuild \
            -project alt-tab-macos.xcodeproj \
            -scheme Release \
            -configuration Release \
            -derivedDataPath DerivedData \
            CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.version }} \
            CODE_SIGN_IDENTITY="Local Self-Signed" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            ENABLE_HARDENED_RUNTIME=NO \
            OTHER_CODE_SIGN_FLAGS=--deep \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO

      - name: Package app
        run: |
          cd DerivedData/Build/Products/Release
          ditto -c -k --keepParent AltTab.app AltTab-${{ steps.ver.outputs.version }}-unlock.zip

      # - name: Upload artifact (download requires GitHub login)
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: AltTab-${{ steps.ver.outputs.version }}-unlock
      #     path: DerivedData/Build/Products/Release/AltTab-${{ steps.ver.outputs.version }}-unlock.zip
      #     if-no-files-found: error
      #     retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: false
          body: |
            Self-signed unlock build (stable cert, not notarized).

            **Install**
            1. Unzip and move `AltTab.app` to `/Applications`
            2. Clear download quarantine:
               ```bash
               xattr -dr com.apple.quarantine /Applications/AltTab.app
               ```
            3. Launch: open `AltTab` in `/Applications`, or run `open /Applications/AltTab.app`
               (Or right-click → Open if Gatekeeper still warns.)

            Grant **Accessibility** (required) and **Screen Recording** (for thumbnails) in System Settings.

            **Update** — just replace the app, permissions carry over:
            1. Quit AltTab, unzip, and overwrite `/Applications/AltTab.app` with the new one
            2. Re-clear quarantine and relaunch:
               ```bash
               xattr -dr com.apple.quarantine /Applications/AltTab.app
               open /Applications/AltTab.app
               ```
            No need to delete the app or re-grant permissions — every build is signed with the same
            stable cert, so macOS keeps your existing grants. (One-time exception: the **first**
            self-signed build after an older ad-hoc build still needs a fresh grant.)

            Full install/update steps: [FORK.md](https://github.com/leo0570/alt-tab-macos/blob/pro-unlock/FORK.md)
          files: DerivedData/Build/Products/Release/AltTab-${{ steps.ver.outputs.version }}-unlock.zip
