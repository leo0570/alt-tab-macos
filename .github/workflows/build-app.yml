# Personal-fork build: compiles AltTab on a GitHub-hosted macOS runner and uploads the
# resulting .app as a downloadable artifact. NO Apple signing cert / notarization / Sparkle
# signing / release publishing (unlike ci_cd.yml). The app is ad-hoc signed so it runs locally
# after the quarantine attribute is cleared. See the repo chat / README for run instructions.
name: Build AltTab (unsigned)

on:
  workflow_dispatch: {}        # lets you trigger it manually from the Actions tab
  push:
    branches: [pro-unlock]     # also builds automatically when you push this branch

jobs:
  build:
    runs-on: macos-15          # same runner image upstream's ci_cd.yml uses
    steps:
      - uses: actions/checkout@v4

      # Match upstream's pinned toolchain. If this exact Xcode is ever missing from the runner
      # image, swap this step for `maxim-lobanov/setup-xcode@v1` with `xcode-version: latest-stable`.
      - name: Select Xcode 26.0.1
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer

      - name: Build Release (ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild \
            -project alt-tab-macos.xcodeproj \
            -scheme Release \
            -configuration Release \
            -derivedDataPath DerivedData \
            CURRENT_PROJECT_VERSION=11.3.0 \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            ENABLE_HARDENED_RUNTIME=NO \
            OTHER_CODE_SIGN_FLAGS=--deep \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO

      # ditto (not zip) preserves the framework symlinks the Sparkle copy-phase creates.
      - name: Package app
        run: |
          cd DerivedData/Build/Products/Release
          ls -la
          ditto -c -k --keepParent AltTab.app AltTab.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AltTab-unsigned
          path: DerivedData/Build/Products/Release/AltTab.zip
          if-no-files-found: error
          retention-days: 90
